<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F0F3F8;
    --card:#FFFFFF;
    --ink:#1C2740;
    --ink2:#7A8AA3;
    --shadow: 20px 20px 40px rgba(174,184,200,0.45), -20px -20px 40px rgba(255,255,255,0.95);
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif;
    background: var(--bg);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: 28px 16px 32px;
    color:var(--ink);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* Orbs iOS wallpaper */
  .orb{
    position:fixed;
    border-radius:50%;
    filter: blur(48px);
    pointer-events:none;
    z-index:0;
    opacity:0.55;
  }
  .orb-1{width:520px;height:520px;background: radial-gradient(circle at 30% 30%, #A9C7FF 0%, #7BA8FF 40%, transparent 70%); top:-180px; left:-140px; animation: drift1 18s ease-in-out infinite alternate;}
  .orb-2{width:460px;height:460px;background: radial-gradient(circle at 50% 50%, #FFD9A0 0%, #FFB08A 45%, transparent 70%); bottom:-120px; right:-120px; animation: drift2 22s ease-in-out infinite alternate;}
  .orb-3{width:380px;height:380px;background: radial-gradient(circle at 40% 40%, #B8F0D8 0%, #7DDDC0 50%, transparent 70%); top:40%; left:55%; animation: drift3 20s ease-in-out infinite alternate;}
  @keyframes drift1{to{transform:translate(60px,40px) scale(1.08)}}
  @keyframes drift2{to{transform:translate(-50px,-60px) scale(1.1)}}
  @keyframes drift3{to{transform:translate(-40px,30px) scale(0.95)}}

  /* Top App - estilo print */
  .top-wrap{
    position:relative;
    z-index:2;
    margin-bottom: 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }

  .app-ra{
    width:84px;
    height:84px;
    border-radius:28px;
    background: linear-gradient(180deg, #5B8CFF 0%, #2E5BDA 55%, #1E3CB0 100%);
    box-shadow:
      0 0 0 6px rgba(255,255,255,0.85),
      0 18px 32px rgba(46,91,218,0.35),
      0 6px 14px rgba(0,0,0,0.12),
      inset 0 1px 1px rgba(255,255,255,0.7),
      inset 0 -2px 6px rgba(0,0,0,0.2);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:900;
    font-size:30px;
    letter-spacing:-1px;
    transform-origin:center;
    animation: iosAppPop 1s cubic-bezier(0.34,1.56,0.64,1) forwards, float 4.5s ease-in-out 1.2s infinite;
  }

  @keyframes iosAppPop{
    0%{transform:scale(0.2) translateY(80px); opacity:0; filter:blur(12px);}
    55%{transform:scale(1.12) translateY(-8px); opacity:1; filter:blur(0);}
    75%{transform:scale(0.96) translateY(2px);}
    100%{transform:scale(1) translateY(0); opacity:1;}
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-5px)}
  }

  /* Dynamic island minimal */
  .island{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    border-radius:999px;
    background: rgba(17,17,17,0.92);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    color:white;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.2px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.12);
    transform: scale(0);
    animation: islandIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards;
  }
  .island-dot{width:18px;height:18px;border-radius:50%;background:#111;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.1);}
  .island-dot::after{content:'';width:6px;height:6px;border-radius:50%;background:#3DD68C;box-shadow:0 0 0 4px rgba(61,214,140,0.18);animation:pulse 2s infinite}
  @keyframes islandIn{to{transform:scale(1)}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(0.85);opacity:0.7}}

  /* GRID */
  .grid-wrapper{width:100%;max-width:560px;aspect-ratio:1/1;position:relative;z-index:2;perspective:1200px;}
  .link-grid{
    width:100%;height:100%;
    display:grid;
    grid-template-columns:4fr 4fr 4fr;
    grid-template-rows:4fr 4fr 4fr;
    gap:14px;
    transition: all 0.55s cubic-bezier(0.22,1,0.36,1);
  }

  .cell{
    position:relative;
    border-radius:26px;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow: 12px 12px 24px rgba(174,184,200,0.36), -12px -12px 24px rgba(255,255,255,0.9), inset 0 1px 0 rgba(255,255,255,1);
    cursor:pointer;
    overflow:hidden;
    opacity:0;
    transform: scale(0.7) translateY(30px);
    animation: iosPop 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  .cell:hover{
    transform: translateY(-4px) scale(1.02) !important;
    box-shadow: 18px 18px 36px rgba(174,184,200,0.45), -12px -12px 24px rgba(255,255,255,0.95), inset 0 1px 0 #fff;
  }
  .cell:active{transform: scale(0.96) !important; transition-duration:0.12s}

  @keyframes iosPop{
    0%{opacity:0; transform: scale(0.7) translateY(30px); filter:blur(8px)}
    60%{opacity:1; transform: scale(1.05) translateY(-6px); filter:blur(0)}
    80%{transform: scale(0.97) translateY(1px)}
    100%{opacity:1; transform: scale(1) translateY(0)}
  }

  /* delay cascata iOS */
  .cell:nth-child(1){animation-delay:0.18s}
  .cell:nth-child(2){animation-delay:0.24s}
  .cell:nth-child(3){animation-delay:0.30s}
  .cell:nth-child(4){animation-delay:0.22s}
  .cell:nth-child(5){animation-delay:0.28s}
  .cell:nth-child(6){animation-delay:0.34s}
  .cell:nth-child(7){animation-delay:0.26s}
  .cell:nth-child(8){animation-delay:0.32s}
  .cell:nth-child(9){animation-delay:0.38s}

  .cell a{display:flex;flex-direction:column;width:100%;height:100%;text-decoration:none;color:inherit;padding:6px;position:relative;z-index:2}
  .cell-media{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  .cell-icon{
    width:100%;height:100%;border-radius:0;
    display:flex;align-items:center;justify-content:center;font-size:28px;
    box-shadow: none;
    transition: transform 0.45s cubic-bezier(0.22,1,0.36,1);
    background: transparent;
  }
  .cell:hover .cell-icon{transform:scale(1.12) translateY(-2px) rotate(-2deg)}
  .cell-emoji{filter:drop-shadow(0 4px 6px rgba(0,0,0,0.15));line-height:1}
  .cell-icon img{width:100%;height:100%;object-fit:contain;border-radius:0;display:block;transition:inherit}

  .cell-text{margin-top:4px;text-align:center;flex-shrink:0}
  .cell-label{font-size:0.75em;font-weight:800;letter-spacing:-0.2px;color:#1E2A44;line-height:1}
  .cell-sub{font-size:0.60em;font-weight:500;color:#7A8AA3;margin-top:1px}

  .cell-fold{display:none}

  /* Dock iOS */
  .dock{
    margin-top:24px;
    display:flex;
    gap:12px;
    padding:10px;
    border-radius:24px;
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    box-shadow: 10px 10px 24px rgba(174,184,200,0.35), -10px -10px 24px rgba(255,255,255,0.9), inset 0 1px 0 #fff;
    position:relative;z-index:2;
    opacity:0;
    animation: dockIn 0.6s cubic-bezier(0.22,1,0.36,1) 0.9s forwards;
  }
  @keyframes dockIn{from{opacity:0;transform:translateY(20px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
  .dock-btn{
    width:54px;height:54px;
    border-radius:16px;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow: 6px 6px 14px rgba(174,184,200,0.35), -6px -6px 14px rgba(255,255,255,0.95), inset 0 1px 0 #fff;
    text-decoration:none;
    transition: all 0.2s ease;
  }
  .dock-btn:active{transform:scale(0.92)}
  .dock-btn svg{width:18px;height:18px}

  .footer{margin-top:18px;text-align:center;position:relative;z-index:2;opacity:0;animation: fadeIn 0.6s ease 1.1s forwards}
  @keyframes fadeIn{to{opacity:1}}
  .footer-copy{font-size:0.66em;color:#A0ADBE;letter-spacing:0.3px}

  /* Cache busting v3 */
  @media (max-width:420px){
    .grid-wrapper{max-width:100%}
    .link-grid{gap:10px}
    .cell{border-radius:20px}
    .cell-icon{width:54px;height:54px;border-radius:16px;font-size:24px}
    .cell-label{font-size:0.72em}
    .cell a{padding:11px}
  }
</style>

<script>
  const grid=document.getElementById('grid');
  const cells=grid.querySelectorAll('.cell');
  const HOVER=6, REST=3;
  function expand(r,c){
    grid.style.gridTemplateColumns=[0,1,2].map(i=>i===c?`${HOVER}fr`:`${REST}fr`).join(' ');
    grid.style.gridTemplateRows=[0,1,2].map(i=>i===r?`${HOVER}fr`:`${REST}fr`).join(' ');
  }
  function reset(){
    grid.style.gridTemplateColumns='4fr 4fr 4fr';
    grid.style.gridTemplateRows='4fr 4fr 4fr';
  }
  cells.forEach(cell=>{
    const r=+cell.dataset.row, c=+cell.dataset.col;
    if(r==null){const idx=Array.from(cells).indexOf(cell); cell.dataset.row=Math.floor(idx/3); cell.dataset.col=idx%3;}
    cell.addEventListener('mouseenter',()=>expand(+cell.dataset.row,+cell.dataset.col));
    cell.addEventListener('mouseleave',reset);
    cell.addEventListener('touchstart',()=>expand(+cell.dataset.row,+cell.dataset.col),{passive:true});
    cell.addEventListener('touchend',reset,{passive:true});
  });
  // parallax leve iOS nos orbs com gyro/mouse
  window.addEventListener('mousemove', e=>{
    const x=(e.clientX/window.innerWidth-0.5)*2;
    const y=(e.clientY/window.innerHeight-0.5)*2;
    document.querySelectorAll('.orb').forEach((orb,i)=>{
      orb.style.transform=`translate(${x*(10+i*5)}px, ${y*(10+i*5)}px) scale(1.05)`;
    });
  });
</script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1a0f">
<title>Raudinei Afonso · Agronomia & Tecnologia Agrícola</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --paper:        #eef4ee;
  --paper-warm:   #e0ebe2;

  --green-deep:   #0d3320;
  --green-mid:    #1a5c35;

  --cyan:         #00b894;
  --cyan-soft:    #7fffdf;

  --ink:          #0a1a0f;
  --ink-mute:     #5a7a65;

  --white:        #ffffff;

  --font-display: 'Syne', sans-serif;
  --font-body:    'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;

  --ease:         cubic-bezier(0.32, 0.72, 0, 1);
  --ease-out:     cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100%;
}

body {
  min-height: 100vh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  position: relative;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, var(--paper) 0%, var(--paper-warm) 100%);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.3;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.3  0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0.04 0'/></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>");
}

.app {
  position: relative;
  z-index: 2;
  max-width: 460px;
  margin: 0 auto;
  padding: 44px 22px 44px;
}

.header {
  text-align: center;
  margin-bottom: 32px;
  opacity: 0;
  animation: fade-up 0.9s var(--ease-out) 0.1s forwards;
}

.header .mark {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.header .mark span { display: block; width: 24px; height: 1px; background: var(--cyan); }
.header .mark .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }

.header h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(36px, 10vw, 48px);
  letter-spacing: -0.02em;
  color: var(--green-deep);
  line-height: 1;
}
.header h1 .first {
  font-size: 1.05em;
  font-weight: 700;
  font-style: italic;
  letter-spacing: -0.04em;
  color: var(--cyan);
}

.header .sub {
  margin-top: 12px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--ink-mute);
}

.hero-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 5;
  opacity: 0;
  animation: fade-up 1s var(--ease-out) 0.3s forwards;
}

.halo {
  position: absolute;
  inset: -32px;
  pointer-events: none;
  z-index: 1;
  border-radius: 50%;
  background:
    radial-gradient(ellipse at 30% 30%, rgba(0, 184, 148, 0.4), transparent 55%),
    radial-gradient(ellipse at 70% 70%, rgba(46, 204, 113, 0.35), transparent 55%),
    radial-gradient(ellipse at 50% 50%, rgba(127, 255, 223, 0.2), transparent 70%);
  filter: blur(28px);
  animation: breathe 8s ease-in-out infinite;
}
.halo::before, .halo::after {
  content: "";
  position: absolute;
  inset: 10%;
  border-radius: 50%;
  filter: blur(20px);
}
.halo::before {
  background: radial-gradient(ellipse at 80% 20%, rgba(0, 184, 148, 0.5), transparent 60%);
  animation: orbit-a 18s ease-in-out infinite;
}
.halo::after {
  background: radial-gradient(ellipse at 20% 80%, rgba(127, 255, 223, 0.4), transparent 60%);
  animation: orbit-b 22s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 0.85; transform: scale(1); }
  50%      { opacity: 1;    transform: scale(1.04); }
}
@keyframes orbit-a {
  0%, 100% { transform: translate(0, 0); }
  33%      { transform: translate(-8px, 6px); }
  66%      { transform: translate(6px, -8px); }
}
@keyframes orbit-b {
  0%, 100% { transform: translate(0, 0); }
  33%      { transform: translate(8px, -6px); }
  66%      { transform: translate(-6px, 8px); }
}

.hero {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 22px;
  overflow: hidden;
  background: var(--green-deep);
  box-shadow:
    0 30px 60px -25px rgba(13, 51, 32, 0.5),
    0 0 0 0.5px rgba(0, 184, 148, 0.15);
  z-index: 2;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4;
  border-radius: 22px;
  box-shadow: inset 0 0 0 1px rgba(0, 184, 148, 0.2);
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  background: linear-gradient(180deg, rgba(13, 51, 32, 0) 60%, rgba(13, 51, 32, 0.35) 100%);
}

.stage { position: absolute; inset: 0; }
.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  will-change: transform, opacity, filter;
}
.slide.active {
  opacity: 1;
  pointer-events: auto;
  z-index: 2;
}
.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}

.slide-fallback {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: linear-gradient(135deg, var(--green-deep) 0%, #061a0d 100%);
  color: rgba(255,255,255,0.4);
}
.slide-fallback svg { opacity: 0.5; }
.slide-fallback span {
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-family: var(--font-display);
}

.slide.exit-fade-zoom { animation: exit-fade-zoom 0.9s var(--ease) forwards; }
@keyframes exit-fade-zoom { to { opacity: 0; transform: scale(1.08); filter: blur(4px); } }
.slide.enter-fade-zoom { animation: enter-fade-zoom 0.9s var(--ease) forwards; }
@keyframes enter-fade-zoom { from { opacity: 0; transform: scale(1.08); filter: blur(4px); } to { opacity: 1; transform: scale(1); filter: blur(0); } }

.slide.exit-dissolve { animation: exit-dissolve 1.1s var(--ease) forwards; }
@keyframes exit-dissolve {
  50%  { opacity: 0.5; filter: blur(8px) brightness(1.2); }
  to   { opacity: 0; filter: blur(20px) brightness(1.4); transform: scale(1.05); }
}
.slide.enter-dissolve { animation: enter-dissolve 1.1s var(--ease) forwards; }
@keyframes enter-dissolve {
  from { opacity: 0; filter: blur(20px) brightness(1.3); transform: scale(0.96); }
  to   { opacity: 1; filter: blur(0); transform: scale(1); }
}

.slide.exit-slide { animation: exit-slide 0.85s var(--ease) forwards; }
@keyframes exit-slide { to { transform: translateX(-30%); opacity: 0; } }
.slide.enter-slide { animation: enter-slide 0.85s var(--ease) forwards; }
@keyframes enter-slide { from { transform: translateX(100%); } to { transform: translateX(0); } }

.dots {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 5px;
  z-index: 5;
}
.dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.5);
  transition: all 0.4s var(--ease);
}
.dot.active {
  background: var(--cyan-soft);
  width: 18px;
  border-radius: 100px;
  box-shadow: 0 0 6px rgba(127, 255, 223, 0.8);
}

.nav-arrow {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 30%;
  z-index: 5;
  background: transparent;
  border: none;
  cursor: pointer;
}
.nav-arrow.prev { left: 70px; }
.nav-arrow.next { right: 0; }

.monogram {
  position: absolute;
  top: 16px;
  right: 16px;
  z-index: 5;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  background: rgba(13, 51, 32, 0.45);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 0.5px solid rgba(0, 184, 148, 0.4);
  border-radius: 50%;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 13px;
  color: var(--cyan-soft);
  letter-spacing: -0.02em;
  pointer-events: none;
}

.links {
  position: absolute;
  top: 50%;
  left: 16px;
  transform: translateY(-50%);
  z-index: 6;
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-start;
}

.link-pill {
  display: inline-flex;
  align-items: center;
  gap: 0;
  padding: 0;
  width: 48px;
  height: 48px;
  border-radius: 100px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 0.5px solid rgba(255, 255, 255, 0.6);
  box-shadow:
    0 4px 12px rgba(13, 51, 32, 0.22),
    0 1px 3px rgba(13, 51, 32, 0.12);
  text-decoration: none;
  color: var(--ink);
  overflow: hidden;
  white-space: nowrap;
  cursor: pointer;
  opacity: 0;
  transform: translateX(-12px);
  animation: slide-in 0.7s var(--ease-out) forwards;
  transition:
    width 0.55s var(--ease),
    padding 0.55s var(--ease),
    gap 0.55s var(--ease),
    background 0.35s var(--ease),
    box-shadow 0.4s var(--ease),
    transform 0.3s var(--ease-out);
}

.link-pill:nth-child(1) { animation-delay: 0.6s; }
.link-pill:nth-child(2) { animation-delay: 0.7s; }
.link-pill:nth-child(3) { animation-delay: 0.8s; }
.link-pill:nth-child(4) { animation-delay: 0.9s; }
.link-pill:nth-child(5) { animation-delay: 1.0s; }

.link-pill:hover,
.link-pill.open,
.link-pill:focus-visible {
  width: 250px;
  padding: 0 18px 0 0;
  gap: 12px;
  background: rgba(255, 255, 255, 0.98);
  box-shadow:
    0 10px 28px rgba(13, 51, 32, 0.3),
    0 2px 6px rgba(13, 51, 32, 0.18);
}

.link-pill:active { transform: translateX(0) scale(0.97); }

.link-pill .icon-wrap {
  flex-shrink: 0;
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 50%;
}
.link-pill .icon-wrap svg { width: 22px; height: 22px; display: block; }

.link-pill .text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  opacity: 0;
  transform: translateX(-6px);
  transition: opacity 0.3s var(--ease) 0.15s, transform 0.4s var(--ease) 0.15s;
}
.link-pill:hover .text,
.link-pill.open .text,
.link-pill:focus-visible .text { opacity: 1; transform: translateX(0); }

.link-pill .label {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 14px;
  color: var(--ink);
  line-height: 1.15;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 6px;
}
.link-pill .sub {
  font-weight: 400;
  font-size: 11px;
  color: var(--ink-mute);
  line-height: 1.15;
  margin-top: 2px;
}

.link-pill.primary {
  background: var(--green-deep);
  border-color: rgba(0, 184, 148, 0.35);
}
.link-pill.primary:hover,
.link-pill.primary.open { background: var(--green-deep); }
.link-pill.primary .label { color: var(--white); }
.link-pill.primary .sub { color: var(--cyan-soft); }

.link-pill.soon { cursor: default; }

.badge-soon {
  display: inline-block;
  padding: 2px 7px;
  background: rgba(0, 184, 148, 0.15);
  border: 0.5px solid rgba(0, 184, 148, 0.3);
  border-radius: 100px;
  font-family: var(--font-display);
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--green-mid);
}

.foot {
  margin-top: 36px;
  text-align: center;
  opacity: 0;
  animation: fade-up 0.9s var(--ease-out) 1.3s forwards;
}
.foot .ornament {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  color: var(--cyan);
  opacity: 0.7;
}
.foot .ornament span { width: 20px; height: 1px; background: currentColor; }
.foot .ornament svg { width: 10px; height: 10px; }
.foot .meta {
  font-size: 10px;
  color: var(--ink-mute);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  opacity: 0.75;
}

@keyframes fade-up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slide-in { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

@media (max-width: 380px) {
  .app { padding: 32px 14px 32px; }
  .link-pill { width: 44px; height: 44px; }
  .link-pill .icon-wrap { width: 44px; height: 44px; }
  .link-pill:hover, .link-pill.open { width: 225px; }
  .links { left: 12px; gap: 10px; }
  .halo { inset: -24px; }
  .nav-arrow.prev { left: 60px; }
}
</style>
</head>
<body>

<main class="app">

  <header class="header">
    <div class="mark" aria-hidden="true">
      <span></span>
      <div class="dot"></div>
      <span></span>
    </div>
    <h1><span class="first">R</span>audinei Afonso</h1>
    <p class="sub">Agronomia & Tecnologia Agrícola</p>
  </header>

  <div class="hero-wrap">
    <div class="halo" aria-hidden="true"></div>

    <section class="hero">
      <div class="stage" id="stage">
        <div class="slide active" data-idx="0" data-img="https://raw.githubusercontent.com/AfonsoRaudinei/afonsoraudinei.github.io/main/imagem1.jpeg"></div>
        <div class="slide" data-idx="1" data-img="https://raw.githubusercontent.com/AfonsoRaudinei/afonsoraudinei.github.io/main/imagem2.jpeg"></div>
        <div class="slide" data-idx="2" data-img="https://raw.githubusercontent.com/AfonsoRaudinei/afonsoraudinei.github.io/main/imagem3.jpeg"></div>
        <div class="slide" data-idx="3" data-img="https://raw.githubusercontent.com/AfonsoRaudinei/afonsoraudinei.github.io/main/imagem4.jpeg"></div>
      </div>

      <button class="nav-arrow prev" id="prevArrow" aria-label="Foto anterior"></button>
      <button class="nav-arrow next" id="nextArrow" aria-label="Próxima foto"></button>

      <div class="monogram" aria-hidden="true">RA</div>

      <nav class="links" id="links" aria-label="Meus links"></nav>

      <div class="dots" id="dots"></div>
    </section>
  </div>

  <footer class="foot">
    <div class="ornament" aria-hidden="true">
      <span></span>
      <svg viewBox="0 0 10 10" fill="currentColor"><circle cx="5" cy="5" r="1.5"/></svg>
      <span></span>
    </div>
    <p class="meta">© <span id="year"></span> Raudinei Afonso</p>
  </footer>

</main>

<script>
(function() {
  'use strict';

  /* ============================================================
     FALLBACK SVG (caso imagem não carregue)
     ============================================================ */
  function makeFallback(n) {
    var div = document.createElement('div');
    div.className = 'slide-fallback';
    div.innerHTML = '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Imagem ' + n + '</span>';
    return div;
  }

  /* ============================================================
     CARREGAR IMAGENS COM FALLBACK
     ============================================================ */
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));

  slides.forEach(function(slide, i) {
    var src = slide.getAttribute('data-img');
    var img = new Image();
    img.alt = 'Imagem ' + (i + 1);
    img.onload = function() {
      slide.appendChild(img);
    };
    img.onerror = function() {
      slide.appendChild(makeFallback(i + 1));
    };
    img.src = src;
  });

  /* ============================================================
     CARROSSEL
     ============================================================ */
  var stage = document.getElementById('stage');
  var dotsEl = document.getElementById('dots');
  var total = slides.length;
  var current = 0;
  var isAnimating = false;

  // Cria dots
  for (var i = 0; i < total; i++) {
    var dot = document.createElement('span');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dotsEl.appendChild(dot);
  }

  var TRANSITIONS = ['fade-zoom', 'dissolve', 'slide'];
  var lastTransition = null;

  function pickTransition() {
    var pool = TRANSITIONS.filter(function(t) { return t !== lastTransition; });
    var pick = pool[Math.floor(Math.random() * pool.length)];
    lastTransition = pick;
    return pick;
  }

  function clearClasses() {
    slides.forEach(function(s) {
      ['fade-zoom', 'dissolve', 'slide'].forEach(function(t) {
        s.classList.remove('exit-' + t, 'enter-' + t);
      });
    });
  }

  function goTo(nextIdx) {
    if (isAnimating || nextIdx === current) return;
    isAnimating = true;
    nextIdx = ((nextIdx % total) + total) % total;

    var transition = pickTransition();
    var exiting = slides[current];
    var entering = slides[nextIdx];

    clearClasses();

    entering.classList.add('active');
    void entering.offsetWidth;

    entering.classList.add('enter-' + transition);
    exiting.classList.add('exit-' + transition);

    var dots = dotsEl.querySelectorAll('.dot');
    for (var i = 0; i < dots.length; i++) {
      dots[i].classList.toggle('active', i === nextIdx);
    }

    setTimeout(function() {
      exiting.classList.remove('active');
      clearClasses();
      current = nextIdx;
      isAnimating = false;
    }, 1200);
  }

  function next() { goTo(current + 1); }
  function prev() { goTo(current - 1); }

  var autoTimer;
  var userInteracting = false;

  function scheduleAuto() {
    clearTimeout(autoTimer);
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    autoTimer = setTimeout(function() {
      if (!userInteracting) next();
      scheduleAuto();
    }, 5500);
  }
  scheduleAuto();

  document.addEventListener('visibilitychange', function() {
    if (document.hidden) clearTimeout(autoTimer);
    else scheduleAuto();
  });

  document.getElementById('nextArrow').addEventListener('click', function() {
    userInteracting = true;
    next();
    setTimeout(function() { userInteracting = false; }, 3000);
  });

  document.getElementById('prevArrow').addEventListener('click', function() {
    userInteracting = true;
    prev();
    setTimeout(function() { userInteracting = false; }, 3000);
  });

  // Swipe
  var touchStartX = 0;
  var touchStartY = 0;

  stage.addEventListener('touchstart', function(e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    userInteracting = true;
  }, { passive: true });

  stage.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) next();
      else prev();
    }
    setTimeout(function() { userInteracting = false; }, 3000);
  }, { passive: true });

  stage.addEventListener('mouseenter', function() { userInteracting = true; });
  stage.addEventListener('mouseleave', function() { userInteracting = false; });

  /* ============================================================
     LINKS
     ============================================================ */
  var LINKS = [
    {
      icon: '<svg viewBox="0 0 24 24" fill="#25D366"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.2-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.9-.8-1.5-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.1c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.6 1.1 2.8c.1.2 1.8 2.7 4.3 3.8.6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3zM12 2C6.5 2 2 6.5 2 12c0 1.7.4 3.3 1.2 4.7L2 22l5.4-1.4c1.4.7 2.9 1.1 4.6 1.1 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>',
      label: 'WhatsApp',
      sub: '63 98437-6572',
      href: 'https://wa.me/5563984376572',
      primary: true

  var linksEl = document.getElementById('links');

  LINKS.forEach(function(link) {
    var el;
    if (link.soon) {
      el = document.createElement('div');
    } else {
      el = document.createElement('a');
      el.href = link.href;
      el.target = '_blank';
      el.rel = 'noopener noreferrer';
    }

    el.className = 'link-pill';
    if (link.primary) el.classList.add('primary');
    if (link.soon)    el.classList.add('soon');
    el.setAttribute('aria-label', link.label);

    var labelHTML = link.label;
    if (link.soon) labelHTML += '<span class="badge-soon">Em Breve</span>';

    var subHTML = link.sub ? '<span class="sub">' + link.sub + '</span>' : '';

    el.innerHTML =
      '<span class="icon-wrap">' + link.icon + '</span>' +
      '<span class="text">' +
        '<span class="label">' + labelHTML + '</span>' +
        subHTML +
      '</span>';

    var opened = false;
    el.addEventListener('click', function(e) {
      var isTouch = window.matchMedia('(hover: none)').matches;
      if (isTouch && !opened) {
        e.preventDefault();
        var others = document.querySelectorAll('.link-pill.open');
        for (var k = 0; k < others.length; k++) {
          if (others[k] !== el) others[k].classList.remove('open');
        }
        el.classList.add('open');
        opened = true;
        setTimeout(function() { opened = false; }, 4000);
      }
    });

    linksEl.appendChild(el);
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.link-pill')) {
      var opens = document.querySelectorAll('.link-pill.open');
      for (var k = 0; k < opens.length; k++) opens[k].classList.remove('open');
    }
  });

  document.getElementById('year').textContent = new Date().getFullYear();

})();
